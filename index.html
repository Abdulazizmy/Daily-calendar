<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA Calendar</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial, sans-serif;
    color:white;
    background:
        radial-gradient(circle at 10% 10%, #39206b 0%, transparent 35%),
        radial-gradient(circle at 90% 90%, #102d55 0%, transparent 35%),
        #080a12;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.app{
    width:min(1500px,96vw);
    min-height:90vh;
    padding:32px;
    border-radius:36px;
    background:rgba(20,22,34,.82);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 30px 80px rgba(0,0,0,.45);
    backdrop-filter:blur(20px);
}

/* HEADER */

.header{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    margin-bottom:28px;
}

.title{
    text-align:center;
}

.title h1{
    margin:0;
    font-size:38px;
    font-weight:700;
}

.title p{
    margin:7px 0 0;
    color:#a8aabd;
    font-size:15px;
}

.nav{
    display:flex;
    gap:10px;
    direction:ltr;
    justify-self:start;
}

.nav button{
    width:48px;
    height:48px;
    border:none;
    border-radius:16px;
    background:rgba(255,255,255,.08);
    color:white;
    font-size:25px;
    cursor:pointer;
    transition:.2s;
}

.nav button:hover{
    background:rgba(255,255,255,.16);
    transform:translateY(-2px);
}

.today-btn{
    justify-self:end;
    border:none;
    border-radius:16px;
    padding:13px 20px;
    color:white;
    background:linear-gradient(135deg,#7c3aed,#a855f7);
    font-weight:bold;
    cursor:pointer;
}

/* WEEKDAYS */

.weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:10px;
    direction:ltr;
    margin-bottom:10px;
}

.weekdays div{
    text-align:center;
    color:#85889b;
    font-size:13px;
    font-weight:bold;
    padding:10px 0;
}

/* CALENDAR */

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:10px;
    direction:ltr;
}

.day{
    direction:rtl;
    min-height:125px;
    padding:13px;
    border-radius:20px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.045);
    transition:.2s;
    position:relative;
    cursor:pointer;
}

.day:hover{
    background:rgba(255,255,255,.08);
    transform:translateY(-2px);
}

.day.empty{
    opacity:0;
    pointer-events:none;
}

.day.current{
    background:linear-gradient(145deg,#6d28d9,#9333ea);
    transform:scale(1.025);
    box-shadow:0 12px 35px rgba(124,58,237,.35);
    border-color:rgba(255,255,255,.18);
}

.day.current::after{
    content:"";
    position:absolute;
    top:12px;
    left:12px;
    width:8px;
    height:8px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 12px white;
}

.day-number{
    font-size:22px;
    font-weight:bold;
    margin-bottom:8px;
}

/* EVENTS */

.events{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.event{
    font-size:11px;
    line-height:1.3;
    padding:5px 7px;
    border-radius:8px;
    background:rgba(255,255,255,.09);
    color:#e9e9f3;
    overflow:hidden;
    text-overflow:ellipsis;
}

.event.rest{
    background:rgba(34,197,94,.16);
    color:#86efac;
}

.event.khanzara{
    background:rgba(239,68,68,.16);
    color:#fca5a5;
}

.event.national{
    background:rgba(239,68,68,.18);
    color:#fca5a5;
}

.event.holiday{
    background:rgba(59,130,246,.18);
    color:#93c5fd;
}

.event.ramadan{
    background:rgba(139,92,246,.18);
    color:#c4b5fd;
}

.event.important{
    background:rgba(245,158,11,.18);
    color:#fcd34d;
}

.event.birthday{
    background:rgba(236,72,153,.18);
    color:#f9a8d4;
}

.event.bills{
    background:rgba(6,182,212,.15);
    color:#67e8f9;
}

/* MODAL */

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.68);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
    padding:20px;
}

.modal-overlay.show{
    display:flex;
}

.modal{
    width:min(430px,92vw);
    padding:32px;
    border-radius:30px;
    text-align:center;
    background:
        radial-gradient(circle at top right,rgba(124,58,237,.3),transparent 45%),
        #151724;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 30px 100px rgba(0,0,0,.6);
    animation:modalIn .25s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:scale(.9) translateY(20px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

.modal-icon{
    font-size:42px;
    margin-bottom:10px;
}

.modal h2{
    margin:0 0 22px;
    font-size:25px;
}

.countdown-number{
    font-size:65px;
    font-weight:800;
    line-height:1;
    margin:10px 0;
    background:linear-gradient(135deg,#c084fc,#818cf8);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.countdown-label{
    color:#a8aabd;
    font-size:14px;
    margin-bottom:25px;
}

.countdown-time{
    direction:ltr;
    font-size:20px;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:25px;
}

.close-modal{
    width:100%;
    border:none;
    padding:13px;
    border-radius:14px;
    background:rgba(255,255,255,.08);
    color:white;
    cursor:pointer;
    font-size:15px;
}

.close-modal:hover{
    background:rgba(255,255,255,.14);
}

/* RESPONSIVE */

@media(max-width:900px){

    .app{
        padding:20px;
    }

    .day{
        min-height:100px;
    }

    .event{
        font-size:9px;
    }

    .day-number{
        font-size:18px;
    }
}

@media(max-width:600px){

    body{
        padding:8px;
    }

    .app{
        padding:12px;
        border-radius:24px;
    }

    .header{
        grid-template-columns:1fr;
        gap:15px;
    }

    .nav{
        justify-self:center;
        order:2;
    }

    .title{
        order:1;
    }

    .today-btn{
        justify-self:center;
        order:3;
    }

    .title h1{
        font-size:28px;
    }

    .calendar,
    .weekdays{
        gap:4px;
    }

    .day{
        min-height:80px;
        padding:7px;
        border-radius:12px;
    }

    .day-number{
        font-size:15px;
        margin-bottom:5px;
    }

    .event{
        font-size:7px;
        padding:3px 4px;
        border-radius:5px;
    }

    .weekdays div{
        font-size:9px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">

        <!-- LEFT: PREVIOUS / NEXT -->
        <div class="nav">
            <button onclick="changeMonth(-1)">←</button>
            <button onclick="changeMonth(1)">→</button>
        </div>

        <div class="title">
            <h1 id="monthTitle"></h1>
            <p id="clock"></p>
        </div>

        <button class="today-btn" onclick="goToday()">TODAY</button>

    </div>

    <!-- SAT → FRI -->
    <div class="weekdays">
        <div>SAT</div>
        <div>SUN</div>
        <div>MON</div>
        <div>TUE</div>
        <div>WED</div>
        <div>THU</div>
        <div>FRI</div>
    </div>

    <div id="calendar" class="calendar"></div>

</div>


<!-- COUNTDOWN MODAL -->

<div id="modalOverlay" class="modal-overlay" onclick="closeModal(event)">

    <div class="modal" onclick="event.stopPropagation()">

        <div id="modalIcon" class="modal-icon">🌙</div>

        <h2 id="modalTitle">باقي على رمضان</h2>

        <div id="countdownDays" class="countdown-number">0</div>

        <div class="countdown-label">يوم</div>

        <div id="countdownTime" class="countdown-time">
            00 : 00 : 00
        </div>

        <button class="close-modal" onclick="hideModal()">
            إغلاق
        </button>

    </div>

</div>


<script>

let currentDate = new Date();

let countdownTimer = null;


/* =========================
   MONTH NAMES
========================= */

const monthNames = [
    "يناير",
    "فبراير",
    "مارس",
    "أبريل",
    "مايو",
    "يونيو",
    "يوليو",
    "أغسطس",
    "سبتمبر",
    "أكتوبر",
    "نوفمبر",
    "ديسمبر"
];


/* =========================
   FIXED EVENTS
========================= */

const fixedEvents = {

    "2-22": {
        text:"🇸🇦 يوم التأسيس",
        className:"national",
        countdown:"يوم التأسيس",
        icon:"🇸🇦"
    },

    "3-11": {
        text:"🇸🇦 يوم العلم",
        className:"important",
        countdown:"يوم العلم",
        icon:"🇸🇦"
    },

    "6-5": {
        text:"🌱 يوم البيئة",
        className:"important",
        countdown:"يوم البيئة",
        icon:"🌱"
    },

    "9-23": {
        text:"🇸🇦 اليوم الوطني",
        className:"national",
        countdown:"اليوم الوطني",
        icon:"🇸🇦"
    },

    "12-9": {
        text:"⚖️ مكافحة الفساد",
        className:"important",
        countdown:"اليوم الدولي لمكافحة الفساد",
        icon:"⚖️"
    },

    "12-18": {
        text:"📚 يوم اللغة العربية",
        className:"important",
        countdown:"اليوم العالمي للغة العربية",
        icon:"📚"
    }

};


/* =========================
   GET HIJRI DATE
========================= */

function getHijri(date){

    try{

        return new Intl.DateTimeFormat(
            "en-US-u-ca-islamic-umalqura",
            {
                day:"numeric",
                month:"numeric",
                year:"numeric"
            }
        ).formatToParts(date);

    }catch(e){

        return new Intl.DateTimeFormat(
            "en-US-u-ca-islamic",
            {
                day:"numeric",
                month:"numeric",
                year:"numeric"
            }
        ).formatToParts(date);

    }

}


/* =========================
   HIJRI VALUES
========================= */

function getHijriValues(date){

    const parts = getHijri(date);

    let day = 0;
    let month = 0;
    let year = 0;

    parts.forEach(p => {

        if(p.type === "day") day = Number(p.value);
        if(p.type === "month") month = Number(p.value);
        if(p.type === "year") year = Number(p.value);

    });

    return {
        day,
        month,
        year
    };

}


/* =========================
   GET UPCOMING HIJRI EVENT
========================= */

function findNextHijriEvent(type){

    let testDate = new Date();

    for(let i = 0; i < 450; i++){

        const h = getHijriValues(testDate);

        if(type === "ramadan" && h.month === 9 && h.day === 1){

            return new Date(testDate);

        }

        if(type === "eidFitr" && h.month === 10 && h.day === 1){

            return new Date(testDate);

        }

        if(type === "arafah" && h.month === 12 && h.day === 9){

            return new Date(testDate);

        }

        if(type === "eidAdha" && h.month === 12 && h.day === 10){

            return new Date(testDate);

        }

        testDate.setDate(testDate.getDate() + 1);

    }

    return null;

}


/* =========================
   ADD EVENT
========================= */

function addEvent(events,text,className,countdown,icon){

    events.push({
        text,
        className,
        countdown,
        icon
    });

}


/* =========================
   GET EVENTS FOR DAY
========================= */

function getEvents(date){

    const events = [];

    const day = date.getDate();
    const month = date.getMonth() + 1;
    const year = date.getFullYear();

    const key = `${month}-${day}`;

    /* BIRTHDAY */

    if(month === 1 && day === 21){

        addEvent(
            events,
            "🎂 يوم ميلاد عمكم",
            "birthday",
            "يوم ميلاد عمكم",
            "🎂"
        );

    }


    /* MONTHLY BILLS */

    if(day === 25){

        addEvent(
            events,
            "📡 قطة النت",
            "bills",
            "قطة النت",
            "📡"
        );

        addEvent(
            events,
            "👷 قطة العامل",
            "bills",
            "قطة العامل",
            "👷"
        );

        addEvent(
            events,
            "⚡ قطة الكهرب",
            "bills",
            "قطة الكهرب",
            "⚡"
        );

    }


    /* HIJRI */

    const hijri = getHijriValues(date);

    if(hijri.month === 9){

        if(hijri.day === 1){

            addEvent(
                events,
                "🌙 رمضان",
                "ramadan",
                "رمضان",
                "🌙"
            );

        }
        else if(hijri.day === 21){

            addEvent(
                events,
                "🌙 العشر الأواخر",
                "ramadan",
                "العشر الأواخر",
                "🌙"
            );

        }

    }


    /* EID AL FITR */

    if(hijri.month === 10){

        if(hijri.day === 1){

            addEvent(
                events,
                "🎉 عيد الفطر",
                "holiday",
                "عيد الفطر",
                "🎉"
            );

        }
        else if(hijri.day >= 2 && hijri.day <= 4){

            addEvent(
                events,
                "🎉 إجازة العيد",
                "holiday",
                "عيد الفطر",
                "🎉"
            );

        }

    }


    /* ARAFAT + EID AL ADHA */

    if(hijri.month === 12){

        if(hijri.day === 9){

            addEvent(
                events,
                "🕋 يوم عرفة",
                "important",
                "يوم عرفة",
                "🕋"
            );

        }

        if(hijri.day === 10){

            addEvent(
                events,
                "🐑 عيد الأضحى",
                "holiday",
                "عيد الأضحى",
                "🐑"
            );

        }

        if(hijri.day >= 11 && hijri.day <= 13){

            addEvent(
                events,
                "🐑 إجازة العيد",
                "holiday",
                "عيد الأضحى",
                "🐑"
            );

        }

    }


    /* FIXED EVENTS */

    if(fixedEvents[key]){

        const e = fixedEvents[key];

        addEvent(
            events,
            e.text,
            e.className,
            e.countdown,
            e.icon
        );

    }


    /* WEEKEND ROTATION */

    /*
       Sep 3 + 4 2026 = است
       Sep 10 + 11 = خنزرة
       Sep 17 + 18 = است
       Sep 24 + 25 = خنزرة
    */

    if(date.getDay() === 4 || date.getDay() === 5){

        const start = new Date(2026,8,3);

        start.setHours(0,0,0,0);

        const diff = Math.floor(
            (date - start) / 86400000
        );

        const weekNumber = Math.floor(diff / 7);

        if(weekNumber % 2 === 0){

            addEvent(
                events,
                "است",
                "rest",
                "است",
                "😴"
            );

        }else{

            addEvent(
                events,
                "خنزرة",
                "khanzara",
                "خنزرة",
                "🔥"
            );

        }

    }

    return events;

}


/* =========================
   RENDER CALENDAR
========================= */

function renderCalendar(){

    const calendar = document.getElementById("calendar");

    calendar.innerHTML = "";

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("monthTitle").textContent =
        `${monthNames[month]} ${year}`;


    /*

       JS:
       Sunday = 0
       Monday = 1
       ...
       Saturday = 6

       We want:
       SAT = 0
       SUN = 1
       MON = 2
       ...
       FRI = 6

    */

    const firstDay = new Date(year,month,1).getDay();

    const offset = (firstDay + 1) % 7;

    const daysInMonth =
        new Date(year,month + 1,0).getDate();


    /* EMPTY DAYS */

    for(let i = 0; i < offset; i++){

        const empty = document.createElement("div");

        empty.className = "day empty";

        calendar.appendChild(empty);

    }


    /* DAYS */

    const today = new Date();

    for(let day = 1; day <= daysInMonth; day++){

        const date = new Date(year,month,day);

        const cell = document.createElement("div");

        cell.className = "day";


        /* CURRENT DAY */

        if(
            day === today.getDate() &&
            month === today.getMonth() &&
            year === today.getFullYear()
        ){

            cell.classList.add("current");

        }


        const number = document.createElement("div");

        number.className = "day-number";

        number.textContent = day;

        cell.appendChild(number);


        /* EVENTS */

        const eventsContainer =
            document.createElement("div");

        eventsContainer.className = "events";


        const events = getEvents(date);


        events.forEach(e => {

            const event =
                document.createElement("div");

            event.className =
                `event ${e.className}`;

            event.textContent = e.text;

            event.onclick = function(event){

                event.stopPropagation();

                openCountdown(
                    e.countdown,
                    e.icon
                );

            };

            eventsContainer.appendChild(event);

        });


        cell.appendChild(eventsContainer);


        /*
           Clicking the day itself:
           If it has events, open the first one.
        */

        cell.onclick = function(){

            if(events.length > 0){

                openCountdown(
                    events[0].countdown,
                    events[0].icon
                );

            }

        };


        calendar.appendChild(cell);

    }

}


/* =========================
   MONTH NAVIGATION
========================= */

function changeMonth(amount){

    currentDate.setMonth(
        currentDate.getMonth() + amount
    );

    renderCalendar();

}


/* =========================
   TODAY
========================= */

function goToday(){

    currentDate = new Date();

    renderCalendar();

}


/* =========================
   CLOCK
========================= */

function updateClock(){

    const now = new Date();

    const time =
        now.toLocaleTimeString(
            "ar-SA",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );

    document.getElementById("clock").textContent =
        time;

}


/* =========================
   COUNTDOWN TARGET
========================= */

function getCountdownTarget(title){

    const now = new Date();


    /* RAMADAN */

    if(title === "رمضان"){

        return findNextHijriEvent("ramadan");

    }


    /* EID FITR */

    if(title === "عيد الفطر"){

        return findNextHijriEvent("eidFitr");

    }


    /* ARAFAT */

    if(title === "يوم عرفة"){

        return findNextHijriEvent("arafah");

    }


    /* EID ADHA */

    if(title === "عيد الأضحى"){

        return findNextHijriEvent("eidAdha");

    }


    /* BIRTHDAY */

    if(title === "يوم ميلاد عمكم"){

        let target =
            new Date(
                now.getFullYear(),
                0,
                21,
                0,0,0
            );

        if(target <= now){

            target.setFullYear(
                now.getFullYear() + 1
            );

        }

        return target;

    }


    /* FIXED ANNUAL EVENTS */

    const fixedMap = {

        "يوم التأسيس":[1,22],
        "يوم العلم":[2,11],
        "يوم البيئة":[5,5],
        "اليوم الوطني":[8,23],
        "اليوم الدولي لمكافحة الفساد":[11,9],
        "اليوم العالمي للغة العربية":[11,18]

    };


    if(fixedMap[title]){

        const [month,day] =
            fixedMap[title];

        let target =
            new Date(
                now.getFullYear(),
                month,
                day,
                0,0,0
            );

        if(target <= now){

            target.setFullYear(
                now.getFullYear() + 1
            );

        }

        return target;

    }


    /*
       For simple recurring monthly events
       we use the next 25th.
    */

    if(
        title === "قطة النت" ||
        title === "قطة العامل" ||
        title === "قطة الكهرب"
    ){

        let target =
            new Date(
                now.getFullYear(),
                now.getMonth(),
                25,
                0,0,0
            );

        if(target <= now){

            target.setMonth(
                target.getMonth() + 1
            );

        }

        return target;

    }


    return null;

}


/* =========================
   OPEN COUNTDOWN
========================= */

function openCountdown(title,icon){

    const target =
        getCountdownTarget(title);

    if(!target) return;


    document.getElementById("modalIcon")
        .textContent = icon || "⏳";

    document.getElementById("modalTitle")
        .textContent = `باقي على ${title}`;


    document.getElementById("modalOverlay")
        .classList.add("show");


    updateCountdown(target);


    clearInterval(countdownTimer);

    countdownTimer =
        setInterval(
            () => updateCountdown(target),
            1000
        );

}


/* =========================
   UPDATE COUNTDOWN
========================= */

function updateCountdown(target){

    const now = new Date();

    let difference =
        target.getTime() - now.getTime();


    if(difference < 0){

        difference = 0;

    }


    const totalSeconds =
        Math.floor(
            difference / 1000
        );


    const days =
        Math.floor(
            totalSeconds / 86400
        );


    const hours =
        Math.floor(
            (totalSeconds % 86400) / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    document.getElementById("countdownDays")
        .textContent = days;


    document.getElementById("countdownTime")
        .textContent =
        `${String(hours).padStart(2,"0")} : ` +
        `${String(minutes).padStart(2,"0")} : ` +
        `${String(seconds).padStart(2,"0")}`;

}


/* =========================
   CLOSE MODAL
========================= */

function hideModal(){

    document.getElementById("modalOverlay")
        .classList.remove("show");

    clearInterval(countdownTimer);

}


function closeModal(event){

    if(
        event.target.id === "modalOverlay"
    ){

        hideModal();

    }

}


/* =========================
   AUTO UPDATE
========================= */

setInterval(updateClock,1000);

setInterval(() => {

    /*
       Re-render every minute so
       today's highlight and dates
       stay accurate.
    */

    renderCalendar();

},60000);


/* =========================
   START
========================= */

updateClock();

renderCalendar();

</script>
