<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(circle at 10% 15%, #312e81 0%, transparent 35%),
        radial-gradient(circle at 90% 85%, #7e22ce 0%, transparent 35%),
        radial-gradient(circle at 80% 10%, #0e7490 0%, transparent 30%),
        linear-gradient(135deg, #020617, #0f172a 50%, #1e1b4b);

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

.calendar-container {
    width: 90%;
    max-width: 1250px;

    background: rgba(15, 23, 42, 0.88);

    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 32px;

    padding: 45px;

    box-shadow:
        0 30px 80px rgba(0,0,0,0.55),
        0 0 80px rgba(99,102,241,0.15);

    backdrop-filter: blur(20px);
}


/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 35px;
}

.month-controls {
    display: flex;
    align-items: center;
    gap: 15px;
}

.month-year {
    font-size: 58px;
    font-weight: bold;
    color: #ffffff;

    min-width: 330px;
}


/* أزرار التنقل */

.nav-button {
    width: 52px;
    height: 52px;

    border-radius: 16px;

    border: 1px solid rgba(255,255,255,0.12);

    background: rgba(255,255,255,0.08);

    color: white;

    font-size: 25px;

    cursor: pointer;

    transition: all 0.2s ease;
}

.nav-button:hover {
    background: rgba(139,92,246,0.35);

    transform: translateY(-2px);
}


/* TODAY */

.today-button {
    font-size: 18px;

    font-weight: bold;

    color: #a78bfa;

    padding: 12px 20px;

    border-radius: 50px;

    background: rgba(139,92,246,0.12);

    border: 1px solid rgba(139,92,246,0.25);

    cursor: pointer;

    transition: all 0.2s ease;
}

.today-button:hover {
    background: rgba(139,92,246,0.25);

    transform: translateY(-2px);
}


/* WEEKDAYS */

.weekdays {
    display: grid;

    grid-template-columns: repeat(7, 1fr);

    gap: 12px;

    margin-bottom: 15px;
}

.weekday {
    text-align: center;

    font-size: 18px;

    font-weight: bold;

    color: #94a3b8;
}


/* CALENDAR */

.calendar {
    display: grid;

    grid-template-columns: repeat(7, 1fr);

    gap: 12px;
}

.day {
    height: 110px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    position: relative;

    border-radius: 20px;

    font-size: 30px;

    font-weight: 500;

    color: #e2e8f0;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.09),
            rgba(255,255,255,0.035)
        );

    border: 1px solid rgba(255,255,255,0.07);

    transition: all 0.25s ease;
}


/* EMPTY */

.empty {
    background: transparent;

    border: none;

    box-shadow: none;
}


/* TODAY */

.today {
    background:
        linear-gradient(
            135deg,
            #4f46e5,
            #7c3aed,
            #a855f7
        );

    color: white;

    font-size: 42px;

    font-weight: bold;

    transform: scale(1.05);

    border: 1px solid rgba(255,255,255,0.25);

    box-shadow:
        0 12px 35px rgba(124,58,237,0.55),
        0 0 35px rgba(139,92,246,0.25);
}

.today::after {
    content: "";

    position: absolute;

    bottom: 10px;

    width: 8px;

    height: 8px;

    background: white;

    border-radius: 50%;

    box-shadow:
        0 0 10px rgba(255,255,255,0.8);
}


/* EVENTS */

.event {
    margin-top: 7px;

    padding: 5px 10px;

    border-radius: 8px;

    font-size: 13px;

    font-weight: bold;

    color: white;

    background: rgba(59,130,246,0.8);

    box-shadow:
        0 4px 12px rgba(59,130,246,0.25);
}


/* REST */

.rest {
    background:
        linear-gradient(
            135deg,
            #0891b2,
            #06b6d4
        );

    box-shadow:
        0 4px 15px rgba(6,182,212,0.3);
}


/* KHANZARA */

.riyadh {
    background:
        linear-gradient(
            135deg,
            #ec4899,
            #f43f5e
        );

    box-shadow:
        0 4px 15px rgba(244,63,94,0.3);
}


/* HOVER */

.day:not(.empty):hover {
    transform: translateY(-3px);
}

.today:hover {
    transform: scale(1.05);
}


/* RESPONSIVE */

@media (max-width: 900px) {

    .calendar-container {
        width: 95%;

        padding: 25px;
    }

    .month-year {
        font-size: 40px;

        min-width: auto;
    }

    .day {
        height: 80px;

        font-size: 23px;
    }

    .today {
        font-size: 34px;
    }

    .event {
        font-size: 10px;

        padding: 4px 6px;
    }

    .nav-button {
        width: 42px;
        height: 42px;

        font-size: 20px;
    }

    .today-button {
        font-size: 14px;

        padding: 10px 15px;
    }
}

</style>
</head>


<body>


<div class="calendar-container">


    <!-- HEADER -->

    <div class="header">


        <div class="month-controls">

            <!-- السابق -->

            <button
                class="nav-button"
                onclick="previousMonth()"
            >
                ‹
            </button>


            <!-- الشهر والسنة -->

            <div
                class="month-year"
                id="monthYear"
            ></div>


            <!-- التالي -->

            <button
                class="nav-button"
                onclick="nextMonth()"
            >
                ›
            </button>

        </div>


        <!-- TODAY -->

        <button
            class="today-button"
            onclick="goToToday()"
        >
            TODAY
        </button>


    </div>


    <!-- DAYS -->

    <div class="weekdays">

        <div class="weekday">SUN</div>
        <div class="weekday">MON</div>
        <div class="weekday">TUE</div>
        <div class="weekday">WED</div>
        <div class="weekday">THU</div>
        <div class="weekday">FRI</div>
        <div class="weekday">SAT</div>

    </div>


    <!-- CALENDAR -->

    <div
        class="calendar"
        id="calendar"
    ></div>


</div>



<script>


/*
========================================
إعدادات التاريخ
========================================
*/


/* بداية جدول الأحداث */

const startDate =
    new Date(2026, 8, 3);


/* الشهر المعروض */

let displayedYear;
let displayedMonth;


/*
========================================
تحديد أحداث الخميس والجمعة
========================================
*/

function getWeekendEvent(date) {


    const day =
        date.getDay();


    /*
    الخميس = 4
    الجمعة = 5
    */

    if (
        day !== 4 &&
        day !== 5
    ) {

        return null;

    }


    const difference =
        date - startDate;


    const days =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );


    const week =
        Math.floor(
            days / 7
        );


    /*
    الأسبوع الأول
    استراحة

    الأسبوع الثاني
    خنزرة

    ثم يتكرر
    */


    if (
        week % 2 === 0
    ) {

        return "rest";

    } else {

        return "riyadh";

    }

}


/*
========================================
إنشاء التقويم
========================================
*/

function createCalendar() {


    const calendar =
        document.getElementById(
            "calendar"
        );


    const monthYear =
        document.getElementById(
            "monthYear"
        );


    /*
    تاريخ اليوم الحقيقي
    */

    const today =
        new Date();


    const todayYear =
        today.getFullYear();


    const todayMonth =
        today.getMonth();


    const todayDate =
        today.getDate();


    /*
    أول يوم في الشهر
    */

    const firstDay =
        new Date(
            displayedYear,
            displayedMonth,
            1
        ).getDay();


    /*
    عدد أيام الشهر
    */

    const daysInMonth =
        new Date(
            displayedYear,
            displayedMonth + 1,
            0
        ).getDate();


    /*
    اسم الشهر
    */

    const monthName =
        new Date(
            displayedYear,
            displayedMonth,
            1
        ).toLocaleDateString(
            "en-US",
            {
                month: "long"
            }
        );


    /*
    عرض الشهر والسنة
    */

    monthYear.textContent =
        monthName +
        " " +
        displayedYear;


    /*
    تنظيف التقويم
    */

    calendar.innerHTML = "";


    /*
    الأيام الفارغة
    */

    for (
        let i = 0;
        i < firstDay;
        i++
    ) {


        const empty =
            document.createElement(
                "div"
            );


        empty.classList.add(
            "day",
            "empty"
        );


        calendar.appendChild(
            empty
        );

    }


    /*
    إنشاء الأيام
    */

    for (
        let i = 1;
        i <= daysInMonth;
        i++
    ) {


        const day =
            document.createElement(
                "div"
            );


        day.classList.add(
            "day"
        );


        /*
        رقم اليوم
        */

        const number =
            document.createElement(
                "div"
            );


        number.textContent =
            i;


        day.appendChild(
            number
        );


        /*
        تاريخ اليوم الحالي
        */

        const thisDate =
            new Date(
                displayedYear,
                displayedMonth,
                i
            );


        /*
        تمييز اليوم الحقيقي
        */

        if (
            i === todayDate &&
            displayedMonth === todayMonth &&
            displayedYear === todayYear
        ) {

            day.classList.add(
                "today"
            );

        }


        /*
        جلب الحدث
        */

        const event =
            getWeekendEvent(
                thisDate
            );


        /*
        إضافة الحدث
        */

        if (event) {


            const eventElement =
                document.createElement(
                    "div"
                );


            eventElement.classList.add(
                "event"
            );


            /*
            استراحة
            */

            if (
                event === "rest"
            ) {

                eventElement.classList.add(
                    "rest"
                );


                eventElement.textContent =
                    "استراحة";

            }


            /*
            خنزرة
            */

            if (
                event === "riyadh"
            ) {

                eventElement.classList.add(
                    "riyadh"
                );


                eventElement.textContent =
                    "خنزرة";

            }


            day.appendChild(
                eventElement
            );

        }


        calendar.appendChild(
            day
        );

    }

}


/*
========================================
الشهر السابق
========================================
*/

function previousMonth() {


    displayedMonth--;


    if (
        displayedMonth < 0
    ) {

        displayedMonth = 11;

        displayedYear--;

    }


    createCalendar();

}


/*
========================================
الشهر التالي
========================================
*/

function nextMonth() {


    displayedMonth++;


    if (
        displayedMonth > 11
    ) {

        displayedMonth = 0;

        displayedYear++;

    }


    createCalendar();

}


/*
========================================
الرجوع لليوم الحالي
========================================
*/

function goToToday() {


    const today =
        new Date();


    displayedYear =
        today.getFullYear();


    displayedMonth =
        today.getMonth();


    createCalendar();

}


/*
========================================
تشغيل أول مرة
========================================
*/

const initialDate =
    new Date();


displayedYear =
    initialDate.getFullYear();


displayedMonth =
    initialDate.getMonth();


createCalendar();


/*
========================================
تحديث تلقائي
========================================
*/

setInterval(
    createCalendar,
    60000
);


</script>


</body>
</html>
