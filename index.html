<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Calendar</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 10% 20%, #312e81 0%, transparent 35%),
        radial-gradient(circle at 90% 80%, #7e22ce 0%, transparent 35%),
        linear-gradient(135deg, #020617, #0f172a);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 1300px;
    background: rgba(15,23,42,.92);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 28px;
    padding: 35px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.controls {
    display: flex;
    align-items: center;
    gap: 15px;
}

.month {
    font-size: 52px;
    font-weight: bold;
    min-width: 320px;
}

button {
    border: 0;
    cursor: pointer;
    color: white;
}

.nav {
    width: 50px;
    height: 50px;
    border-radius: 15px;
    background: rgba(255,255,255,.08);
    font-size: 30px;
}

.nav:hover {
    background: rgba(139,92,246,.35);
}

.today-btn {
    padding: 13px 22px;
    border-radius: 30px;
    background: rgba(139,92,246,.2);
    color: #c4b5fd;
    font-weight: bold;
}

.weekdays,
.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
}

.weekdays {
    margin-bottom: 10px;
}

.weekday {
    text-align: center;
    color: #94a3b8;
    font-weight: bold;
}

.day {
    height: 105px;
    border-radius: 18px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.07);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    position: relative;
}

.empty {
    background: transparent;
    border: 0;
}

.day.today {
    background: linear-gradient(135deg,#4f46e5,#7c3aed,#a855f7);
    transform: scale(1.04);
    font-size: 40px;
    font-weight: bold;
    box-shadow: 0 12px 35px rgba(124,58,237,.55);
}

.day.today::after {
    content: "";
    width: 8px;
    height: 8px;
    background: white;
    border-radius: 50%;
    position: absolute;
    bottom: 9px;
}

.event {
    margin-top: 6px;
    padding: 5px 9px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: bold;
    white-space: nowrap;
}

.rest {
    background: #0891b2;
}

.khanzara {
    background: #e11d48;
}

.national {
    background: #16a34a;
}

.holiday {
    background: #d97706;
}

.important {
    background: #9333ea;
}

@media (max-width: 800px) {

    .container {
        padding: 20px;
        width: 96%;
    }

    .month {
        font-size: 34px;
        min-width: auto;
    }

    .day {
        height: 75px;
        font-size: 20px;
    }

    .day.today {
        font-size: 28px;
    }

    .event {
        font-size: 8px;
        padding: 3px 5px;
    }

    .nav {
        width: 40px;
        height: 40px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="controls">

            <button class="nav" onclick="changeMonth(-1)">‹</button>

            <div class="month" id="monthYear"></div>

            <button class="nav" onclick="changeMonth(1)">›</button>

        </div>

        <button class="today-btn" onclick="goToday()">
            TODAY
        </button>

    </div>

    <div class="weekdays">
        <div class="weekday">SUN</div>
        <div class="weekday">MON</div>
        <div class="weekday">TUE</div>
        <div class="weekday">WED</div>
        <div class="weekday">THU</div>
        <div class="weekday">FRI</div>
        <div class="weekday">SAT</div>
    </div>

    <div class="calendar" id="calendar"></div>

</div>

<script>

let currentDate = new Date();

/* تاريخ بداية التناوب */
const startDate = new Date(2026, 8, 3);


/* المناسبات */
const events = {
"2026-01-21": ["important", "يوم ميلاد عمكم 🎂"],
    "2026-02-22": ["national", "يوم التأسيس"],

    "2026-03-11": ["national", "يوم العلم"],

    "2026-03-20": ["holiday", "عيد الفطر"],
    "2026-03-21": ["holiday", "إجازة العيد"],
    "2026-03-22": ["holiday", "إجازة العيد"],
    "2026-03-23": ["holiday", "إجازة العيد"],

    "2026-05-26": ["holiday", "يوم عرفة"],
    "2026-05-27": ["holiday", "عيد الأضحى"],
    "2026-05-28": ["holiday", "إجازة العيد"],
    "2026-05-29": ["holiday", "إجازة العيد"],
    "2026-05-30": ["holiday", "إجازة العيد"],

    "2026-06-05": ["important", "يوم البيئة"],

    "2026-09-23": ["national", "اليوم الوطني"],

    "2026-12-09": ["important", "مكافحة الفساد"],

    "2026-12-18": ["important", "اليوم العالمي للغة العربية"]
};


/* تحويل التاريخ إلى YYYY-MM-DD */
function dateKey(date) {

    const y = date.getFullYear();

    const m = String(
        date.getMonth() + 1
    ).padStart(2, "0");

    const d = String(
        date.getDate()
    ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


/* مناسبات الخميس والجمعة */
function weekendEvent(date) {

    const day = date.getDay();

    if (day !== 4 && day !== 5) {
        return null;
    }

    const diff =
        Math.floor(
            (date - startDate) /
            (1000 * 60 * 60 * 24)
        );

    const week =
        Math.floor(diff / 7);

    if (week % 2 === 0) {

        return ["rest", "است"];

    } else {

        return ["khanzara", "خنزرة"];

    }
}


/* إنشاء التقويم */
function renderCalendar() {

    const calendar =
        document.getElementById("calendar");

    const title =
        document.getElementById("monthYear");

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();

    const today =
        new Date();

    const monthName =
        new Date(year, month, 1)
        .toLocaleDateString(
            "en-US",
            { month: "long" }
        );

    title.textContent =
        `${monthName} ${year}`;


    calendar.innerHTML = "";


    /* أول يوم في الشهر */
    const firstDay =
        new Date(year, month, 1).getDay();


    /* عدد أيام الشهر */
    const days =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    /* الفراغات */
    for (let i = 0; i < firstDay; i++) {

        const empty =
            document.createElement("div");

        empty.className =
            "day empty";

        calendar.appendChild(empty);
    }


    /* الأيام */
    for (let dayNumber = 1; dayNumber <= days; dayNumber++) {

        const date =
            new Date(
                year,
                month,
                dayNumber
            );

        const box =
            document.createElement("div");

        box.className = "day";


        /* رقم اليوم */
        const number =
            document.createElement("div");

        number.textContent =
            dayNumber;

        box.appendChild(number);


        /* اليوم الحالي */
        if (
            dayNumber === today.getDate() &&
            month === today.getMonth() &&
            year === today.getFullYear()
        ) {

            box.classList.add("today");
        }


        /* الحدث */
        const key =
            dateKey(date);

        let event =
            events[key];


        /* إذا ما فيه مناسبة، نستخدم الخميس والجمعة */
        if (!event) {

            event =
                weekendEvent(date);
        }


        /* إضافة الحدث */
        if (event) {

            const eventBox =
                document.createElement("div");

            eventBox.className =
                `event ${event[0]}`;

            eventBox.textContent =
                event[1];

            box.appendChild(eventBox);
        }


        calendar.appendChild(box);
    }
}


/* الشهر السابق / التالي */
function changeMonth(amount) {

    currentDate.setMonth(
        currentDate.getMonth() + amount
    );

    renderCalendar();
}


/* الرجوع للشهر الحالي */
function goToday() {

    currentDate = new Date();

    renderCalendar();
}


/* تشغيل */
renderCalendar();


/* تحديث تلقائي */
setInterval(
    renderCalendar,
    60000
);

</script>

</body>
</html>
