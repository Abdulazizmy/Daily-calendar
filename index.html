<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 15% 20%, rgba(120,70,255,.18), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(0,180,255,.12), transparent 30%),
        #09090f;
    color: white;
    overflow-x: hidden;
}

.container {
    width: 94%;
    max-width: 1500px;
    margin: auto;
    padding: 25px 0;
}

header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    margin-bottom: 18px;
}

.month-title {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
}

.today-btn {
    justify-self: end;
    background: rgba(255,255,255,.08);
    color: white;
    border: 1px solid rgba(255,255,255,.12);
    padding: 10px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
}

.top-info {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    margin-bottom: 20px;
}

#clock {
    font-size: 42px;
    font-weight: 700;
    direction: ltr;
    letter-spacing: 1px;
}

#dateText {
    color: #a8a8b8;
    margin-top: 5px;
    font-size: 15px;
}

#prayerStatus {
    margin-top: 10px;
    color: #d6d2ff;
    font-size: 15px;
    direction: rtl;
    text-align: center;
}

.nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    direction: ltr;
}

.nav button {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.06);
    color: white;
    font-size: 25px;
    cursor: pointer;
}

.weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-bottom: 8px;
    direction: ltr;
}

.weekday {
    text-align: center;
    color: #9292a5;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 0;
}

.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    direction: ltr;
}

.day {
    min-height: 105px;
    border-radius: 17px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.07);
    padding: 11px;
    position: relative;
    cursor: pointer;
    overflow: hidden;
    direction: rtl;
}

.other-month {
    opacity: .25;
}

.today {
    min-height: 135px;
    background:
        radial-gradient(circle at top right, rgba(190,120,255,.35), transparent 55%),
        linear-gradient(135deg,#6e45d8,#452b9c);
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 10px 35px rgba(90,50,200,.25);
    transform: scale(1.015);
    z-index: 2;
}

.today-dot {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 10px rgba(255,255,255,.8);
}

.day-number {
    font-size: 17px;
    font-weight: 700;
    direction: ltr;
    text-align: left;
}

.events {
    margin-top: 9px;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.event {
    border-radius: 8px;
    padding: 4px 7px;
    font-size: 11px;
    line-height: 1.3;
    background: rgba(255,255,255,.09);
    color: #eee;
    border-right: 3px solid #8f6cff;
    cursor: pointer;
}

.birthday {
    border-right-color: #ff73c8;
    background: rgba(255,115,200,.12);
}

.holiday {
    border-right-color: #ffca5c;
    background: rgba(255,202,92,.12);
}

.ramadan {
    border-right-color: #65d6ff;
    background: rgba(101,214,255,.11);
}

.eid {
    border-right-color: #71e6a5;
    background: rgba(113,230,165,.11);
}

.bills {
    border-right-color: #ff8c5c;
    background: rgba(255,140,92,.11);
}

.rest {
    border-right-color: #ff6b6b;
    background: rgba(255,107,107,.11);
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.68);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(500px,100%);
    background: #15151f;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 24px;
    padding: 28px;
    text-align: center;
}

.close {
    background: transparent;
    border: 0;
    color: #aaa;
    font-size: 28px;
    cursor: pointer;
}

.modal-icon {
    font-size: 38px;
    margin-bottom: 8px;
}

.modal-title {
    font-size: 23px;
    font-weight: 700;
    margin-bottom: 22px;
}

.countdown {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 8px;
    direction: ltr;
}

.time-box {
    background: rgba(255,255,255,.06);
    border-radius: 14px;
    padding: 14px 5px;
}

.time-value {
    font-size: 25px;
    font-weight: 700;
}

.time-label {
    font-size: 11px;
    color: #9999aa;
    margin-top: 4px;
}

@media(max-width:900px) {
    .day { min-height:90px; }
    .today { min-height:115px; }
    .event { font-size:10px; }
    #clock { font-size:34px; }
}

@media(max-width:600px) {
    .container {
        width:97%;
        padding-top:15px;
    }

    header {
        grid-template-columns:1fr;
        gap:10px;
    }

    .month-title {
        order:-1;
    }

    .today-btn {
        justify-self:center;
    }

    .day {
        min-height:75px;
        padding:7px;
        border-radius:12px;
    }

    .today {
        min-height:95px;
    }

    .weekday {
        font-size:11px;
    }

    .day-number {
        font-size:14px;
    }

    .event {
        font-size:8px;
        padding:3px 4px;
    }

    #clock {
        font-size:28px;
    }

    .countdown {
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div></div>

    <div class="month-title" id="monthTitle"></div>

    <button class="today-btn" onclick="goToday()">TODAY</button>
</header>

<div class="top-info">
    <div id="clock">00:00:00</div>
    <div id="dateText"></div>
    <div id="prayerStatus">جاري تحميل أوقات الصلاة...</div>
</div>

<div class="nav">
    <button onclick="changeMonth(-1)">←</button>
    <button onclick="changeMonth(1)">→</button>
</div>

<!-- السبت يسار ← الجمعة يمين -->
<div class="weekdays">
    <div class="weekday">SAT</div>
    <div class="weekday">SUN</div>
    <div class="weekday">MON</div>
    <div class="weekday">TUE</div>
    <div class="weekday">WED</div>
    <div class="weekday">THU</div>
    <div class="weekday">FRI</div>
</div>

<div class="calendar" id="calendar"></div>

</div>

<div class="modal" id="modal">
    <div class="modal-box">

        <button class="close" onclick="closeModal()">×</button>

        <div class="modal-icon" id="modalIcon">⏳</div>
        <div class="modal-title" id="modalTitle">Countdown</div>

        <div class="countdown">

            <div class="time-box">
                <div class="time-value" id="days">00</div>
                <div class="time-label">Days</div>
            </div>

            <div class="time-box">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Hours</div>
            </div>

            <div class="time-box">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Minutes</div>
            </div>

            <div class="time-box">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Seconds</div>
            </div>

        </div>
    </div>
</div>

<script>

/* =========================
   التاريخ
========================= */

let currentDate = new Date();
const today = new Date();

const monthNames = [
    "January","February","March","April",
    "May","June","July","August",
    "September","October","November","December"
];

const arabicDays = [
    "الأحد","الاثنين","الثلاثاء",
    "الأربعاء","الخميس","الجمعة","السبت"
];


/* =========================
   المناسبات
========================= */

const fixedEvents = {

    "2-22": {
        title:"يوم التأسيس 🇸🇦",
        className:"holiday",
        icon:"🇸🇦"
    },

    "3-11": {
        title:"يوم العلم 🇸🇦",
        className:"holiday",
        icon:"🇸🇦"
    },

    "6-5": {
        title:"يوم البيئة العالمي 🌍",
        className:"holiday",
        icon:"🌍"
    },

    "9-23": {
        title:"اليوم الوطني 🇸🇦",
        className:"holiday",
        icon:"🇸🇦"
    },

    "12-9": {
        title:"اليوم العالمي لمكافحة الفساد",
        className:"holiday",
        icon:"🌍"
    },

    "12-18": {
        title:"اليوم العالمي للغة العربية",
        className:"holiday",
        icon:"📚"
    }
};


/* =========================
   است / خنزرة
========================= */

function getWeekendEvent(date) {

    const day = date.getDay();

    if (day !== 4 && day !== 5)
        return null;

    const start = new Date(2026,8,3);

    const current = new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
    );

    const diff = Math.floor(
        (current - start) / 86400000
    );

    /* 24 و25 سبتمبر است */

    if (
        date.getFullYear() === 2026 &&
        date.getMonth() === 8 &&
        (date.getDate() === 24 ||
         date.getDate() === 25)
    ) {

        return {
            title:"است 🔥",
            className:"rest",
            icon:"🔥",
            countdown:"است",
            isRest:true
        };
    }

    const cycle = Math.floor(diff / 7);

    if (cycle % 2 === 0) {

        return {
            title:"است 🔥",
            className:"rest",
            icon:"🔥",
            countdown:"است",
            isRest:true
        };

    }

    return {
        title:"خنزرة 💤",
        className:"rest",
        icon:"💤",
        countdown:"خنزرة",
        isRest:true
    };
}


/* =========================
   التقويم الهجري
========================= */

function getHijriParts(date) {

    try {

        const parts = new Intl.DateTimeFormat(
            "en-US-u-ca-islamic-umalqura",
            {
                day:"numeric",
                month:"numeric",
                year:"numeric"
            }
        ).formatToParts(date);

        let day = null;
        let month = null;

        parts.forEach(part => {

            if (part.type === "day")
                day = Number(part.value);

            if (part.type === "month")
                month = Number(part.value);

        });

        return {day,month};

    } catch(e) {

        return {day:null,month:null};

    }
}


/* =========================
   الأحداث
========================= */

function getEvents(date) {

    const events = [];

    const month = date.getMonth()+1;
    const day = date.getDate();

    /* الميلاد */

    if (month === 1 && day === 21) {

        events.push({
            title:"يوم ميلاد عمكم 🎂",
            className:"birthday",
            icon:"🎂",
            countdown:"يوم ميلاد عمكم"
        });

    }

    /* الفواتير */

    if (day === 25) {

        events.push({
            title:"📡 قطة النت",
            className:"bills",
            icon:"📡",
            countdown:"قطة النت"
        });

        events.push({
            title:"👷 قطة العامل",
            className:"bills",
            icon:"👷",
            countdown:"قطة العامل"
        });

        events.push({
            title:"⚡ قطة الكهرب",
            className:"bills",
            icon:"⚡",
            countdown:"قطة الكهرب"
        });

    }

    /* رمضان والأعياد */

    const hijri = getHijriParts(date);

    if (hijri.month === 9) {

        if (hijri.day === 1) {

            events.push({
                title:"رمضان 🌙",
                className:"ramadan",
                icon:"🌙",
                countdown:"رمضان"
            });

        }

        if (hijri.day === 21) {

            events.push({
                title:"العشر الأواخر 🌙",
                className:"ramadan",
                icon:"🌙",
                countdown:"العشر الأواخر"
            });

        }

    }

    if (hijri.month === 10) {

        if (hijri.day === 1) {

            events.push({
                title:"عيد الفطر 🎉",
                className:"eid",
                icon:"🎉",
                countdown:"عيد الفطر"
            });

        }

        if (hijri.day >= 2 && hijri.day <= 4) {

            events.push({
                title:"إجازة العيد",
                className:"eid",
                icon:"🎉",
                countdown:"إجازة العيد"
            });

        }

    }

    if (hijri.month === 12) {

        if (hijri.day === 9) {

            events.push({
                title:"يوم عرفة 🕋",
                className:"holiday",
                icon:"🕋",
                countdown:"يوم عرفة"
            });

        }

        if (hijri.day === 10) {

            events.push({
                title:"عيد الأضحى 🐑",
                className:"eid",
                icon:"🐑",
                countdown:"عيد الأضحى"
            });

        }

        if (hijri.day >= 11 && hijri.day <= 13) {

            events.push({
                title:"إجازة العيد",
                className:"eid",
                icon:"🐑",
                countdown:"إجازة العيد"
            });

        }

    }

    /* المناسبات السعودية */

    const key = `${month}-${day}`;

    if (fixedEvents[key]) {

        events.push({
            ...fixedEvents[key],
            countdown:fixedEvents[key].title
        });

    }

    /* است / خنزرة */

    const weekend = getWeekendEvent(date);

    if (weekend)
        events.push(weekend);

    return events;
}


/* =========================
   رسم التقويم
========================= */

function renderCalendar() {

    const calendar =
        document.getElementById("calendar");

    calendar.innerHTML = "";

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("monthTitle")
        .textContent =
        `${monthNames[month]} ${year}`;

    /*
       تحويل بداية الشهر:
       السبت = 0
       الأحد = 1
       ...
       الجمعة = 6
    */

    let firstDay =
        new Date(year,month,1).getDay();

    firstDay =
        (firstDay + 1) % 7;

    const daysInMonth =
        new Date(year,month+1,0).getDate();

    const daysInPreviousMonth =
        new Date(year,month,0).getDate();

    for (let i=0;i<42;i++) {

        let date;
        let otherMonth = false;

        if (i < firstDay) {

            const day =
                daysInPreviousMonth -
                firstDay +
                i +
                1;

            date =
                new Date(
                    year,
                    month-1,
                    day
                );

            otherMonth = true;

        } else if (
            i >= firstDay + daysInMonth
        ) {

            const day =
                i -
                firstDay -
                daysInMonth +
                1;

            date =
                new Date(
                    year,
                    month+1,
                    day
                );

            otherMonth = true;

        } else {

            const day =
                i -
                firstDay +
                1;

            date =
                new Date(
                    year,
                    month,
                    day
                );
        }

        const cell =
            document.createElement("div");

        cell.className = "day";

        if (otherMonth)
            cell.classList.add("other-month");

        const isToday =
            date.getFullYear() === today.getFullYear() &&
            date.getMonth() === today.getMonth() &&
            date.getDate() === today.getDate();

        if (isToday && !otherMonth) {

            cell.classList.add("today");

            const dot =
                document.createElement("div");

            dot.className = "today-dot";

            cell.appendChild(dot);
        }

        const number =
            document.createElement("div");

        number.className = "day-number";
        number.textContent = date.getDate();

        cell.appendChild(number);

        const eventsContainer =
            document.createElement("div");

        eventsContainer.className = "events";

        const events =
            getEvents(date);

        events.forEach(e => {

            const event =
                document.createElement("div");

            event.className =
                `event ${e.className || ""}`;

            event.textContent =
                e.title;

            event.onclick =
                function(ev) {

                    ev.stopPropagation();

                    openCountdown(
                        e.countdown || e.title,
                        e.icon || "⏳",
                        date,
                        e.isRest === true
                    );
                };

            eventsContainer.appendChild(event);

        });

        cell.appendChild(eventsContainer);

        cell.onclick = function() {

            if (events.length > 0) {

                openCountdown(
                    events[0].countdown ||
                    events[0].title,
                    events[0].icon || "⏳",
                    date,
                    events[0].isRest === true
                );
            }

        };

        calendar.appendChild(cell);
    }
}


/* =========================
   التنقل
========================= */

function changeMonth(amount) {

    currentDate.setMonth(
        currentDate.getMonth()+amount
    );

    renderCalendar();
}

function goToday() {

    currentDate = new Date();

    renderCalendar();
}


/* =========================
   الساعة
========================= */

function updateClock() {

    const now = new Date();

    document.getElementById("clock")
        .textContent =
        now.toLocaleTimeString(
            "en-GB",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );

    document.getElementById("dateText")
        .textContent =
        `${arabicDays[now.getDay()]} ${now.getDate()} ${monthNames[now.getMonth()]} ${now.getFullYear()}`;
}

updateClock();

setInterval(updateClock,1000);


/* =========================
   الصلاة
========================= */

const prayerNames = {
    Fajr:"الفجر",
    Dhuhr:"الظهر",
    Asr:"العصر",
    Maghrib:"المغرب",
    Isha:"العشاء"
};

const prayerIcons = {
    Fajr:"🌅",
    Dhuhr:"☀️",
    Asr:"🌤️",
    Maghrib:"🌇",
    Isha:"🌙"
};

const iqamaDelays = {
    Fajr:15,
    Dhuhr:10,
    Asr:10,
    Maghrib:10,
    Isha:10
};

let prayerCache = {};

function getDateKey(date) {

    const y = date.getFullYear();

    const m =
        String(date.getMonth()+1)
        .padStart(2,"0");

    const d =
        String(date.getDate())
        .padStart(2,"0");

    return `${y}-${m}-${d}`;
}


/*
   جلب مواقيت الرياض
*/

async function fetchPrayerTimes(date) {

    const key = getDateKey(date);

    if (prayerCache[key])
        return prayerCache[key];

    try {

        const url =
            `https://api.aladhan.com/v1/timings/${key}?latitude=24.7136&longitude=46.6753&method=4`;

        const response =
            await fetch(url, {
                cache:"no-store"
            });

        if (!response.ok)
            throw new Error("Prayer API error");

        const json =
            await response.json();

        if (
            json.code === 200 &&
            json.data &&
            json.data.timings
        ) {

            prayerCache[key] =
                json.data.timings;

            return prayerCache[key];
        }

    } catch(error) {

        console.error(
            "Prayer times:",
            error
        );

    }

    return null;
}


/*
   تحويل وقت الصلاة إلى Date
*/

function timeToDate(date,time) {

    const clean =
        time.substring(0,5);

    const [hour,minute] =
        clean.split(":").map(Number);

    const result =
        new Date(date);

    result.setHours(
        hour,
        minute,
        0,
        0
    );

    return result;
}


function addMinutes(date,minutes) {

    return new Date(
        date.getTime() +
        minutes * 60000
    );
}


/*
   تحويل المدة
*/

function formatDuration(ms) {

    if (ms < 0)
        ms = 0;

    const totalSeconds =
        Math.floor(ms / 1000);

    const hours =
        Math.floor(totalSeconds / 3600);

    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );

    const seconds =
        totalSeconds % 60;

    return [
        String(hours).padStart(2,"0"),
        String(minutes).padStart(2,"0"),
        String(seconds).padStart(2,"0")
    ].join(":");
}


/*
   تحديد الصلاة الحالية / القادمة
*/

async function getPrayerTarget(now) {

    const today =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
        );

    const timings =
        await fetchPrayerTimes(today);

    if (!timings)
        return null;

    const prayers = [
        "Fajr",
        "Dhuhr",
        "Asr",
        "Maghrib",
        "Isha"
    ];

    for (const prayer of prayers) {

        if (!timings[prayer])
            continue;

        const adhan =
            timeToDate(
                today,
                timings[prayer]
            );

        const iqama =
            addMinutes(
                adhan,
                iqamaDelays[prayer]
            );

        if (now < adhan) {

            return {
                name:prayerNames[prayer],
                icon:prayerIcons[prayer],
                target:adhan,
                phase:"prayer"
            };
        }

        if (now < iqama) {

            return {
                name:prayerNames[prayer],
                icon:prayerIcons[prayer],
                target:iqama,
                phase:"iqama"
            };
        }
    }

    /*
       بعد العشاء:
       نجيب فجر اليوم التالي
    */

    const tomorrow =
        new Date(today);

    tomorrow.setDate(
        tomorrow.getDate()+1
    );

    const tomorrowTimings =
        await fetchPrayerTimes(tomorrow);

    if (
        tomorrowTimings &&
        tomorrowTimings.Fajr
    ) {

        return {
            name:prayerNames.Fajr,
            icon:prayerIcons.Fajr,
            target:timeToDate(
                tomorrow,
                tomorrowTimings.Fajr
            ),
            phase:"prayer"
        };
    }

    return null;
}


/*
   تحديث الصلاة
*/

let lastPrayerUpdate = 0;
let currentPrayerData = null;

async function loadPrayerData() {

    const now = new Date();

    /*
       لا نعيد طلب API كل ثانية
    */

    if (
        currentPrayerData &&
        now.getTime() - lastPrayerUpdate < 6*60*60*1000
    ) {
        return;
    }

    const today =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
        );

    const tomorrow =
        new Date(today);

    tomorrow.setDate(
        tomorrow.getDate()+1
    );

    await Promise.all([
        fetchPrayerTimes(today),
        fetchPrayerTimes(tomorrow)
    ]);

    lastPrayerUpdate =
        now.getTime();

    currentPrayerData = true;
}


async function updatePrayerStatus() {

    const status =
        document.getElementById(
            "prayerStatus"
        );

    try {

        await loadPrayerData();

        const now =
            new Date();

        const result =
            await getPrayerTarget(now);

        if (!result) {

            status.textContent =
                "تعذر تحميل أوقات الصلاة";

            return;
        }

        const remaining =
            formatDuration(
                result.target - now
            );

        if (result.phase === "prayer") {

            status.textContent =
                `الصلاة الجاية: ${result.name} ${result.icon} — باقي ${remaining}`;

        } else {

            status.textContent =
                `${result.name} ${result.icon} — باقي على الإقامة ${remaining}`;
        }

    } catch(error) {

        console.error(error);

        status.textContent =
            "تعذر تحميل أوقات الصلاة";

    }
}

updatePrayerStatus();

setInterval(
    updatePrayerStatus,
    1000
);


/* =========================
   Countdown
========================= */

let countdownInterval = null;

async function openCountdown(
    title,
    icon,
    selectedDate,
    isRest=false
) {

    const modal =
        document.getElementById("modal");

    document.getElementById("modalTitle")
        .textContent = title;

    document.getElementById("modalIcon")
        .textContent = icon;

    modal.classList.add("show");

    clearInterval(countdownInterval);

    let targetDate;

    if (isRest) {

        const timings =
            await fetchPrayerTimes(
                selectedDate
            );

        if (
            timings &&
            timings.Isha
        ) {

            const isha =
                timeToDate(
                    selectedDate,
                    timings.Isha
                );

            targetDate =
                addMinutes(
                    isha,
                    60
                );

        } else {

            targetDate =
                new Date(selectedDate);

            targetDate.setHours(
                23,0,0,0
            );
        }

    } else {

        targetDate =
            new Date(selectedDate);

        targetDate.setHours(
            0,0,0,0
        );
    }


    function updateCountdown() {

        let difference =
            targetDate - new Date();

        if (difference < 0)
            difference = 0;

        const totalSeconds =
            Math.floor(
                difference / 1000
            );

        const days =
            Math.floor(
                totalSeconds / 86400
            );

        const hours =
            Math.floor(
                (totalSeconds % 86400) / 3600
            );

        const minutes =
            Math.floor(
                (totalSeconds % 3600) / 60
            );

        const seconds =
            totalSeconds % 60;

        document.getElementById("days")
            .textContent =
            String(days).padStart(2,"0");

        document.getElementById("hours")
            .textContent =
            String(hours).padStart(2,"0");

        document.getElementById("minutes")
            .textContent =
            String(minutes).padStart(2,"0");

        document.getElementById("seconds")
            .textContent =
            String(seconds).padStart(2,"0");
    }

    updateCountdown();

    countdownInterval =
        setInterval(
            updateCountdown,
            1000
        );
}


function closeModal() {

    document.getElementById("modal")
        .classList.remove("show");

    clearInterval(
        countdownInterval
    );
}


document.getElementById("modal")
    .addEventListener(
        "click",
        function(e) {

            if (e.target === this)
                closeModal();

        }
    );


/* تشغيل التقويم */

renderCalendar();
