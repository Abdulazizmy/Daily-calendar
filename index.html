<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abdulaziz Calendar</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:#fff;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(124,58,237,.30),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(37,99,235,.25),
            transparent 30%
        ),
        #080a12;

    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.app{
    width:min(1500px,96vw);

    background:rgba(18,20,32,.82);

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    border-radius:36px;

    padding:32px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.45);
}


/* =========================
   Header
========================= */

.header{
    display:grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items:center;

    margin-bottom:25px;
}

.nav{
    display:flex;

    gap:10px;

    direction:ltr;

    justify-self:start;
}

.nav button{
    width:48px;
    height:48px;

    border:none;

    border-radius:15px;

    background:
        rgba(255,255,255,.08);

    color:#fff;

    font-size:25px;

    cursor:pointer;

    transition:.2s;
}

.nav button:hover{
    background:
        rgba(255,255,255,.16);

    transform:scale(1.05);
}

.title{
    text-align:center;
}

.title h1{
    margin:0;

    font-size:32px;

    font-weight:800;
}

.clock{
    margin-top:7px;

    font-size:14px;

    opacity:.55;

    direction:ltr;
}

.today-btn{
    justify-self:end;

    border:none;

    padding:13px 20px;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #6366f1
        );

    color:#fff;

    font-weight:bold;

    cursor:pointer;
}


/* =========================
   Weekdays
========================= */

.weekdays,
.calendar{
    display:grid;

    grid-template-columns:
        repeat(7,1fr);

    direction:ltr;

    gap:10px;
}

.weekday{
    text-align:center;

    padding:10px;

    color:
        rgba(255,255,255,.45);

    font-size:13px;

    font-weight:bold;
}


/* =========================
   Calendar days
========================= */

.day{
    min-height:125px;

    padding:13px;

    border-radius:20px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.05);

    position:relative;

    cursor:pointer;

    transition:.2s;

    direction:rtl;
}

.day:hover{
    background:
        rgba(255,255,255,.075);

    transform:translateY(-2px);
}

.day.empty{
    opacity:0;

    pointer-events:none;
}

.day.current{
    background:
        radial-gradient(
            circle at 80% 20%,
            rgba(255,255,255,.18),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #7c3aed,
            #4f46e5
        );

    transform:scale(1.035);

    box-shadow:
        0 15px 35px
        rgba(99,102,241,.28);
}

.day.current::after{
    content:"";

    width:7px;
    height:7px;

    background:#fff;

    border-radius:50%;

    position:absolute;

    top:12px;
    left:12px;
}

.day-number{
    font-size:20px;

    font-weight:800;

    direction:ltr;

    display:inline-block;
}


/* =========================
   Events
========================= */

.events{
    margin-top:12px;

    display:flex;

    flex-direction:column;

    gap:5px;
}

.event{
    font-size:11px;

    padding:6px 8px;

    border-radius:9px;

    background:
        rgba(255,255,255,.09);

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    cursor:pointer;

    transition:.15s;
}

.event:hover{
    background:
        rgba(255,255,255,.18);
}


/* است */

.event.rest{
    background:
        rgba(255,170,0,.15);
}


/* خنزرة */

.event.khanzara{
    background:
        rgba(255,255,255,.10);
}


/* عيد الميلاد */

.event.birthday{
    background:
        rgba(236,72,153,.20);
}


/* المناسبات الوطنية */

.event.national{
    background:
        rgba(34,197,94,.18);
}


/* الإجازات */

.event.holiday{
    background:
        rgba(59,130,246,.18);
}


/* رمضان */

.event.ramadan{
    background:
        rgba(139,92,246,.20);
}


/* المناسبات المهمة */

.event.important{
    background:
        rgba(245,158,11,.18);
}


/* الفواتير */

.event.bills{
    background:
        rgba(14,165,233,.17);
}


/* =========================
   Ramadan background
========================= */

.day.ramadan-day{
    background:
        linear-gradient(
            145deg,
            rgba(124,58,237,.13),
            rgba(255,255,255,.035)
        );
}


/* =========================
   Modal
========================= */

.modal-overlay{
    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.72);

    backdrop-filter:blur(10px);

    display:flex;

    justify-content:center;

    align-items:center;

    opacity:0;

    visibility:hidden;

    transition:.25s;

    z-index:999;
}

.modal-overlay.show{
    opacity:1;

    visibility:visible;
}

.modal{
    width:min(500px,90vw);

    background:#171927;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius:30px;

    padding:30px;

    text-align:center;

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.5);

    position:relative;
}

.close{
    position:absolute;

    top:15px;
    left:15px;

    width:38px;
    height:38px;

    border:none;

    border-radius:12px;

    background:
        rgba(255,255,255,.08);

    color:#fff;

    font-size:20px;

    cursor:pointer;
}

.modal-icon{
    font-size:48px;

    margin-bottom:10px;
}

.modal h2{
    margin:
        5px 0 25px;

    font-size:24px;
}

.countdown{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:10px;
}

.time-box{
    background:
        rgba(255,255,255,.06);

    border-radius:18px;

    padding:16px 8px;
}

.time-number{
    font-size:28px;

    font-weight:800;
}

.time-label{
    font-size:11px;

    opacity:.45;

    margin-top:5px;
}


/* =========================
   Loading
========================= */

.loading{
    font-size:16px;

    opacity:.7;

    margin:20px 0;
}


/* =========================
   Responsive
========================= */

@media(max-width:900px){

    .app{
        padding:20px;
    }

    .day{
        min-height:105px;

        padding:9px;
    }

    .event{
        font-size:9px;

        padding:5px;
    }

}


@media(max-width:650px){

    body{
        padding:10px;
    }

    .app{
        padding:12px;

        border-radius:25px;
    }

    .header{
        grid-template-columns:
            auto
            1fr
            auto;
    }

    .title h1{
        font-size:22px;
    }

    .nav button{
        width:38px;
        height:38px;

        font-size:20px;
    }

    .today-btn{
        padding:9px 12px;

        font-size:11px;
    }

    .weekdays,
    .calendar{
        gap:5px;
    }

    .weekday{
        font-size:9px;

        padding:5px 0;
    }

    .day{
        min-height:90px;

        padding:7px;

        border-radius:12px;
    }

    .day-number{
        font-size:15px;
    }

    .events{
        margin-top:7px;

        gap:3px;
    }

    .event{
        font-size:7px;

        padding:4px;

        border-radius:6px;
    }

}


@media(max-width:450px){

    .day{
        min-height:75px;
    }

    .event{
        font-size:6px;
    }

    .countdown{
        gap:6px;
    }

    .time-number{
        font-size:21px;
    }

}

</style>
</head>


<body>


<div class="app">


    <!-- Header -->

    <div class="header">


        <div class="nav">

            <button
                onclick="changeMonth(-1)"
            >
                ←
            </button>

            <button
                onclick="changeMonth(1)"
            >
                →
            </button>

        </div>


        <div class="title">

            <h1 id="monthTitle"></h1>

            <div
                class="clock"
                id="clock"
            ></div>

        </div>


        <button
            class="today-btn"
            onclick="goToday()"
        >
            TODAY
        </button>


    </div>


    <!-- Weekdays -->

    <div class="weekdays">

        <div class="weekday">SAT</div>

        <div class="weekday">SUN</div>

        <div class="weekday">MON</div>

        <div class="weekday">TUE</div>

        <div class="weekday">WED</div>

        <div class="weekday">THU</div>

        <div class="weekday">FRI</div>

    </div>


    <!-- Calendar -->

    <div
        class="calendar"
        id="calendar"
    ></div>


</div>



<!-- =========================
     Countdown Modal
========================= -->

<div
    class="modal-overlay"
    id="modalOverlay"
>

    <div
        class="modal"
        onclick="event.stopPropagation()"
    >


        <button
            class="close"
            onclick="closeCountdown()"
        >
            ×
        </button>


        <div
            class="modal-icon"
            id="modalIcon"
        >
            ⏳
        </div>


        <h2 id="modalTitle">
            باقي على
        </h2>


        <div
            id="loading"
            class="loading"
            style="display:none;"
        >
            جاري حساب وقت الاست...
        </div>


        <div
            class="countdown"
            id="countdownBox"
        >

            <div class="time-box">

                <div
                    class="time-number"
                    id="days"
                >
                    0
                </div>

                <div class="time-label">
                    يوم
                </div>

            </div>


            <div class="time-box">

                <div
                    class="time-number"
                    id="hours"
                >
                    0
                </div>

                <div class="time-label">
                    ساعة
                </div>

            </div>


            <div class="time-box">

                <div
                    class="time-number"
                    id="minutes"
                >
                    0
                </div>

                <div class="time-label">
                    دقيقة
                </div>

            </div>


            <div class="time-box">

                <div
                    class="time-number"
                    id="seconds"
                >
                    0
                </div>

                <div class="time-label">
                    ثانية
                </div>

            </div>

        </div>


    </div>

</div>



<script>


/* =========================
   Variables
========================= */

let currentDate = new Date();

let countdownTimer = null;


/* =========================
   Arabic months
========================= */

const months = [

    "يناير",

    "فبراير",

    "مارس",

    "أبريل",

    "مايو",

    "يونيو",

    "يوليو",

    "أغسطس",

    "سبتمبر",

    "أكتوبر",

    "نوفمبر",

    "ديسمبر"

];


/* =========================
   Fixed Events
========================= */

const fixedEvents = {


    "2-22":{

        title:"يوم التأسيس 🇸🇦",

        className:"national",

        countdown:"يوم التأسيس",

        icon:"🇸🇦"

    },


    "3-11":{

        title:"يوم العلم 🇸🇦",

        className:"national",

        countdown:"يوم العلم",

        icon:"🇸🇦"

    },


    "6-5":{

        title:"يوم البيئة العالمي 🌱",

        className:"important",

        countdown:"يوم البيئة العالمي",

        icon:"🌱"

    },


    "9-23":{

        title:"اليوم الوطني 🇸🇦",

        className:"national",

        countdown:"اليوم الوطني",

        icon:"🇸🇦"

    },


    "12-9":{

        title:"اليوم العالمي لمكافحة الفساد",

        className:"important",

        countdown:"اليوم العالمي لمكافحة الفساد",

        icon:"⚖️"

    },


    "12-18":{

        title:"اليوم العالمي للغة العربية",

        className:"important",

        countdown:"اليوم العالمي للغة العربية",

        icon:"📚"

    }

};


/* =========================
   Weekend rotation
========================= */

function getWeekendEvent(date){


    const day =
        date.getDay();


    /*
       الخميس = 4
       الجمعة = 5
    */

    if(
        day !== 4 &&
        day !== 5
    ){

        return null;

    }


    /*
       البداية:

       الخميس 3 سبتمبر 2026
       الجمعة 4 سبتمبر 2026

       = است 🔥

       الأسبوع التالي
       = خنزرة 💤
    */

    const base =
        new Date(
            2026,
            8,
            3
        );


    base.setHours(
        0,0,0,0
    );


    const diff =
        Math.floor(
            (date-base) /
            86400000
        );


    const week =
        Math.floor(
            diff/7
        );


    if(
        week % 2 === 0
    ){

        return {

            title:"است 🔥",

            className:"rest",

            countdown:"است",

            icon:"🔥",

            isRest:true

        };

    }


    return {

        title:"خنزرة 💤",

        className:"khanzara",

        countdown:"خنزرة",

        icon:"💤",

        isRest:false

    };

}


/* =========================
   Islamic Calendar
========================= */

function getIslamicDate(date){


    try{

        const formatter =
            new Intl.DateTimeFormat(

                "en-US-u-ca-islamic-umalqura",

                {

                    day:"numeric",

                    month:"numeric",

                    year:"numeric"

                }

            );


        const parts =
            formatter.formatToParts(
                date
            );


        let day = null;

        let month = null;

        let year = null;


        parts.forEach(part=>{


            if(
                part.type === "day"
            ){

                day =
                    Number(
                        part.value
                    );

            }


            if(
                part.type === "month"
            ){

                month =
                    Number(
                        part.value
                    );

            }


            if(
                part.type === "year"
            ){

                year =
                    Number(
                        part.value
                    );

            }

        });


        return {

            day,
            month,
            year

        };

    }

    catch(e){

        return null;

    }

}


/* =========================
   Prayer time
========================= */

/*
   يجلب وقت العشاء من الرياض
   للتاريخ الذي ضغط عليه المستخدم.

   method=4
   = Umm Al-Qura University, Makkah
*/

async function getIshaTime(date){


    const day =
        String(
            date.getDate()
        ).padStart(2,"0");


    const month =
        String(
            date.getMonth()+1
        ).padStart(2,"0");


    const year =
        date.getFullYear();


    const dateString =
        `${day}-${month}-${year}`;


    const url =
        `https://api.aladhan.com/v1/timingsByCity/${dateString}?city=Riyadh&country=Saudi%20Arabia&method=4`;


    const response =
        await fetch(url);


    if(!response.ok){

        throw new Error(
            "Prayer API error"
        );

    }


    const data =
        await response.json();


    if(
        !data.data ||
        !data.data.timings ||
        !data.data.timings.Isha
    ){

        throw new Error(
            "Isha time unavailable"
        );

    }


    const isha =
        data.data.timings.Isha;


    /*
       أحيانًا قد تأتي القيمة
       معها معلومات إضافية.

       نأخذ أول 5 أحرف فقط:
       HH:MM
    */

    const cleanIsha =
        isha.substring(0,5);


    const parts =
        cleanIsha.split(":");


    const hours =
        Number(parts[0]);


    const minutes =
        Number(parts[1]);


    /*
       إنشاء وقت العشاء
       في نفس تاريخ الحدث
    */

    const target =
        new Date(date);


    target.setHours(
        hours,
        minutes,
        0,
        0
    );


    /*
       الاست = بعد العشاء بساعة
    */

    target.setMinutes(
        target.getMinutes()+60
    );


    return target;

}


/* =========================
   Normal countdown target
========================= */

function getNormalTarget(
    title,
    selectedDate
){


    if(selectedDate){

        const target =
            new Date(
                selectedDate
            );


        target.setHours(
            0,0,0,0
        );


        return target;

    }


    return null;

}


/* =========================
   Open Countdown
========================= */

async function openCountdown(
    title,
    icon,
    selectedDate,
    isRest=false
){


    clearInterval(
        countdownTimer
    );


    const overlay =
        document.getElementById(
            "modalOverlay"
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const countdownBox =
        document.getElementById(
            "countdownBox"
        );


    document.getElementById(
        "modalIcon"
    ).textContent =
        icon || "⏳";


    document.getElementById(
        "modalTitle"
    ).textContent =
        `باقي على ${title}`;


    overlay.classList.add(
        "show"
    );


    /*
       إذا كان الحدث = است
       نجيب وقت العشاء لذلك اليوم
       ثم نضيف ساعة.
    */

    if(isRest){


        loading.style.display =
            "block";


        countdownBox.style.display =
            "none";


        try{


            const target =
                await getIshaTime(
                    selectedDate
                );


            /*
               بعد ما جاب وقت العشاء
               نبدأ العد التنازلي.
            */

            loading.style.display =
                "none";


            countdownBox.style.display =
                "grid";


            updateCountdown(
                target
            );


            countdownTimer =
                setInterval(

                    function(){

                        updateCountdown(
                            target
                        );

                    },

                    1000

                );


        }

        catch(error){


            loading.textContent =
                "تعذر جلب وقت صلاة العشاء";


            console.error(error);

        }


        return;

    }


    /*
       بقية الأحداث:
       العد يكون إلى بداية اليوم المحدد.
    */

    loading.style.display =
        "none";


    countdownBox.style.display =
        "grid";


    const target =
        getNormalTarget(
            title,
            selectedDate
        );


    if(!target){

        return;

    }


    updateCountdown(
        target
    );


    countdownTimer =
        setInterval(

            function(){

                updateCountdown(
                    target
                );

            },

            1000

        );

}


/* =========================
   Update Countdown
========================= */

function updateCountdown(
    target
){


    const now =
        new Date();


    let diff =
        target-now;


    if(diff < 0){

        diff = 0;

    }


    const days =
        Math.floor(
            diff /
            86400000
        );


    diff %=
        86400000;


    const hours =
        Math.floor(
            diff /
            3600000
        );


    diff %=
        3600000;


    const minutes =
        Math.floor(
            diff /
            60000
        );


    diff %=
        60000;


    const seconds =
        Math.floor(
            diff /
            1000
        );


    document.getElementById(
        "days"
    ).textContent =
        days;


    document.getElementById(
        "hours"
    ).textContent =
        hours;


    document.getElementById(
        "minutes"
    ).textContent =
        minutes;


    document.getElementById(
        "seconds"
    ).textContent =
        seconds;

}


/* =========================
   Close Countdown
========================= */

function closeCountdown(){


    document
        .getElementById(
            "modalOverlay"
        )
        .classList
        .remove("show");


    clearInterval(
        countdownTimer
    );


    countdownTimer =
        null;

}


/* =========================
   Render Calendar
========================= */

function renderCalendar(){


    const calendar =
        document.getElementById(
            "calendar"
        );


    calendar.innerHTML =
        "";


    const year =
        currentDate.getFullYear();


    const month =
        currentDate.getMonth();


    document.getElementById(
        "monthTitle"
    ).textContent =
        `${months[month]} ${year}`;


    /*
       JavaScript:

       Sunday = 0
       Monday = 1
       ...
       Saturday = 6

       نحن نريد:

       SAT SUN MON TUE WED THU FRI
    */

    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const offset =
        (firstDay+1)%7;


    const daysInMonth =
        new Date(
            year,
            month+1,
            0
        ).getDate();


    /*
       Empty cells
    */

    for(
        let i=0;
        i<offset;
        i++
    ){

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "day empty";


        calendar.appendChild(
            empty
        );

    }


    /*
       Days
    */

    for(
        let day=1;
        day<=daysInMonth;
        day++
    ){


        const date =
            new Date(
                year,
                month,
                day
            );


        date.setHours(
            0,0,0,0
        );


        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "day";


        /*
           Today
        */

        const today =
            new Date();


        if(

            day ===
            today.getDate()

            &&

            month ===
            today.getMonth()

            &&

            year ===
            today.getFullYear()

        ){

            cell.classList.add(
                "current"
            );

        }


        /*
           Day number
        */

        const number =
            document.createElement(
                "div"
            );


        number.className =
            "day-number";


        number.textContent =
            day;


        cell.appendChild(
            number
        );


        /*
           Events container
        */

        const eventsContainer =
            document.createElement(
                "div"
            );


        eventsContainer.className =
            "events";


        /*
           ALL events
        */

        const events = [];


        /* =========================
           Birthday
        ========================= */

        if(

            month === 0

            &&

            day === 21

        ){

            events.push({

                title:
                    "يوم ميلاد عمكم 🎂",

                className:
                    "birthday",

                countdown:
                    "يوم ميلاد عمكم",

                icon:
                    "🎂",

                isRest:
                    false

            });

        }


        /* =========================
           Bills - Day 25
        ========================= */

        if(
            day === 25
        ){

            events.push({

                title:
                    "📡 قطة النت",

                className:
                    "bills",

                countdown:
                    "قطة النت",

                icon:
                    "📡",

                isRest:
                    false

            });


            events.push({

                title:
                    "👷 قطة العامل",

                className:
                    "bills",

                countdown:
                    "قطة العامل",

                icon:
                    "👷",

                isRest:
                    false

            });


            events.push({

                title:
                    "⚡ قطة الكهرب",

                className:
                    "bills",

                countdown:
                    "قطة الكهرب",

                icon:
                    "⚡",

                isRest:
                    false

            });

        }


        /* =========================
           Islamic Date
        ========================= */

        const islamic =
            getIslamicDate(
                date
            );


        if(islamic){


            /*
               Ramadan
            */

            if(
                islamic.month === 9
            ){

                cell.classList.add(
                    "ramadan-day"
                );


                if(
                    islamic.day === 1
                ){

                    events.push({

                        title:
                            "رمضان 🌙",

                        className:
                            "ramadan",

                        countdown:
                            "رمضان",

                        icon:
                            "🌙",

                        isRest:
                            false

                    });

                }


                if(
                    islamic.day === 21
                ){

                    events.push({

                        title:
                            "العشر الأواخر 🌙",

                        className:
                            "ramadan",

                        countdown:
                            "العشر الأواخر",

                        icon:
                            "🌙",

                        isRest:
                            false

                    });

                }

            }


            /*
               Eid Al-Fitr
            */

            if(
                islamic.month === 10
            ){

                if(
                    islamic.day === 1
                ){

                    events.push({

                        title:
                            "عيد الفطر 🎉",

                        className:
                            "holiday",

                        countdown:
                            "عيد الفطر",

                        icon:
                            "🎉",

                        isRest:
                            false

                    });

                }


                if(

                    islamic.day >= 2

                    &&

                    islamic.day <= 4

                ){

                    events.push({

                        title:
                            "إجازة العيد",

                        className:
                            "holiday",

                        countdown:
                            "إجازة العيد",

                        icon:
                            "🎉",

                        isRest:
                            false

                    });

                }

            }


            /*
               Eid Al-Adha
            */

            if(
                islamic.month === 12
            ){

                if(
                    islamic.day === 9
                ){

                    events.push({

                        title:
                            "يوم عرفة 🕋",

                        className:
                            "holiday",

                        countdown:
                            "يوم عرفة",

                        icon:
                            "🕋",

                        isRest:
                            false

                    });

                }


                if(
                    islamic.day === 10
                ){

                    events.push({

                        title:
                            "عيد الأضحى 🐑",

                        className:
                            "holiday",

                        countdown:
                            "عيد الأضحى",

                        icon:
                            "🐑",

                        isRest:
                            false

                    });

                }


                if(

                    islamic.day >= 11

                    &&

                    islamic.day <= 13

                ){

                    events.push({

                        title:
                            "إجازة العيد",

                        className:
                            "holiday",

                        countdown:
                            "إجازة العيد",

                        icon:
                            "🐑",

                        isRest:
                            false

                    });

                }

            }

        }


        /* =========================
           Fixed events
        ========================= */

        const key =
            `${month+1}-${day}`;


        if(
            fixedEvents[key]
        ){

            events.push({

                ...fixedEvents[key],

                isRest:false

            });

        }


        /* =========================
           Weekend
        ========================= */

        const weekendEvent =
            getWeekendEvent(
                date
            );


        if(weekendEvent){

            events.push(
                weekendEvent
            );

        }


        /* =========================
           Render ALL events
        ========================= */

        events.forEach(
            e=>{

                const event =
                    document.createElement(
                        "div"
                    );


                event.className =
                    `event ${e.className}`;


                event.textContent =
                    e.title;


                /*
                   مهم:

                   نمرر date نفسها
                   للعدّاد.

                   لذلك إذا رحت مثلًا
                   إلى ديسمبر وضغطت است
                   يحسب ديسمبر نفسه،
                   وليس أقرب است من اليوم.
                */

                event.onclick =
                    function(ev){

                        ev.stopPropagation();


                        openCountdown(

                            e.countdown,

                            e.icon,

                            date,

                            e.isRest === true

                        );

                    };


                eventsContainer.appendChild(
                    event
                );

            }
        );


        cell.appendChild(
            eventsContainer
        );


        /*
           إذا ضغط على اليوم نفسه
           نفتح أول حدث.
        */

        cell.onclick =
            function(){

                if(
                    events.length > 0
                ){

                    openCountdown(

                        events[0].countdown,

                        events[0].icon,

                        date,

                        events[0].isRest === true

                    );

                }

            };


        calendar.appendChild(
            cell
        );

    }

}


/* =========================
   Change Month
========================= */

function changeMonth(
    amount
){

    currentDate.setMonth(
        currentDate.getMonth()+amount
    );


    renderCalendar();

}


/* =========================
   Go Today
========================= */

function goToday(){

    currentDate =
        new Date();


    renderCalendar();

}


/* =========================
   Clock
========================= */

function updateClock(){

    const now =
        new Date();


    document.getElementById(
        "clock"
    ).textContent =

        now.toLocaleTimeString(
            "en-SA",

            {

                hour:"2-digit",

                minute:"2-digit",

                second:"2-digit"

            }

        );

}


/* =========================
   Start
========================= */

renderCalendar();

updateClock();


/*
   تحديث الساعة كل ثانية
*/

setInterval(

    updateClock,

    1000

);


/*
   تحديث التقويم كل دقيقة
   إذا كان على الشهر الحالي.
*/

setInterval(

    function(){

        const now =
            new Date();


        if(

            currentDate.getFullYear()
            ===
            now.getFullYear()

            &&

            currentDate.getMonth()
            ===
            now.getMonth()

        ){

            renderCalendar();

        }

    },

    60000

);


/*
   إغلاق النافذة إذا ضغط
   خارج العداد.
*/

document
    .getElementById(
        "modalOverlay"
    )
    .addEventListener(

        "click",

        function(){

            closeCountdown();

        }

    );

</script>
