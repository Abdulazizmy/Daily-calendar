<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Calendar</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: "Cairo", sans-serif;
    color: #fff;
    background:
        radial-gradient(circle at 15% 10%, rgba(124, 58, 237, .30), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(59, 130, 246, .22), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(168, 85, 247, .18), transparent 35%),
        #08090f;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.app {
    width: min(1500px, 96vw);
    min-height: 90vh;
    padding: 32px;
    border-radius: 36px;
    background: rgba(20, 21, 32, .72);
    border: 1px solid rgba(255,255,255,.09);
    box-shadow:
        0 30px 100px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.05);
    backdrop-filter: blur(25px);
}

/* HEADER */

.header {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 20px;
    margin-bottom: 28px;
}

.nav {
    display: flex;
    gap: 10px;
}

.nav button,
.today-btn {
    border: 0;
    color: #fff;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.08);
    cursor: pointer;
    transition: .25s;
    font-family: inherit;
}

.nav button {
    width: 48px;
    height: 48px;
    border-radius: 16px;
    font-size: 25px;
}

.nav button:hover,
.today-btn:hover {
    background: rgba(124,58,237,.35);
    transform: translateY(-2px);
}

.title-area {
    text-align: center;
}

#monthTitle {
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 800;
    letter-spacing: -.8px;
}

.subtitle {
    color: #9699aa;
    font-size: 14px;
    margin-top: 3px;
}

.clock {
    margin-top: 8px;
    font-size: 14px;
    color: #c8c9d4;
}

.today-btn {
    padding: 12px 20px;
    border-radius: 15px;
    font-weight: 700;
    font-size: 14px;
}

/* WEEKDAYS */

.weekdays {
    direction: ltr;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
    margin-bottom: 10px;
}

.weekday {
    text-align: center;
    color: #85889a;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 0;
}

/* CALENDAR */

.calendar {
    direction: ltr;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
}

.day {
    direction: rtl;
    position: relative;
    min-height: 125px;
    padding: 13px;
    border-radius: 20px;
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.055);
    overflow: hidden;
    transition: .25s;
}

.day:hover {
    background: rgba(255,255,255,.075);
    transform: translateY(-2px);
}

.day.empty {
    opacity: .15;
}

.day-number {
    font-size: 18px;
    font-weight: 700;
    color: #e9e9ef;
}

/* TODAY */

.day.current {
    min-height: 145px;
    background:
        radial-gradient(circle at 80% 10%, rgba(255,255,255,.22), transparent 25%),
        linear-gradient(145deg, #8b5cf6, #5b21b6);
    border-color: rgba(255,255,255,.2);
    box-shadow:
        0 15px 45px rgba(124,58,237,.35),
        inset 0 1px rgba(255,255,255,.18);
    transform: scale(1.015);
    z-index: 2;
}

.day.current .day-number {
    font-size: 24px;
    color: #fff;
}

.day.current::after {
    content: "";
    position: absolute;
    top: 14px;
    left: 14px;
    width: 8px;
    height: 8px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(255,255,255,.9);
}

/* EVENTS */

.events {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-top: 9px;
}

.event {
    width: fit-content;
    max-width: 100%;
    padding: 3px 8px;
    border-radius: 8px;
    font-size: 10px;
    line-height: 1.5;
    font-weight: 700;
    color: #fff;
    white-space: normal;
}

.rest {
    background: rgba(34,197,94,.18);
    color: #86efac;
    border: 1px solid rgba(34,197,94,.15);
}

.khanzara {
    background: rgba(239,68,68,.17);
    color: #fca5a5;
    border: 1px solid rgba(239,68,68,.15);
}

.national {
    background: rgba(16,185,129,.2);
    color: #6ee7b7;
}

.holiday {
    background: rgba(245,158,11,.2);
    color: #fcd34d;
}

.ramadan {
    background: rgba(99,102,241,.2);
    color: #a5b4fc;
}

.ramadan-day {
    border-color: rgba(129,140,248,.16);
}

.important {
    background: rgba(59,130,246,.2);
    color: #93c5fd;
}

.birthday {
    background: rgba(236,72,153,.2);
    color: #f9a8d4;
}

.bills {
    background: rgba(168,85,247,.22);
    color: #d8b4fe;
    border: 1px solid rgba(168,85,247,.2);
}

/* RAMADAN */

.day.ramadan-day::before {
    content: "☾";
    position: absolute;
    top: 8px;
    left: 10px;
    color: rgba(167,139,250,.35);
    font-size: 17px;
}

/* FOOTER */

.footer {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 22px;
}

.legend {
    display: flex;
    align-items: center;
    gap: 7px;
    color: #898c9b;
    font-size: 11px;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
}

.dot.purple { background: #8b5cf6; }
.dot.green { background: #22c55e; }
.dot.red { background: #ef4444; }
.dot.yellow { background: #f59e0b; }
.dot.pink { background: #ec4899; }

/* RESPONSIVE */

@media (max-width: 900px) {

    body {
        padding: 10px;
        align-items: flex-start;
    }

    .app {
        width: 100%;
        padding: 18px;
        border-radius: 25px;
    }

    .header {
        grid-template-columns: 1fr;
    }

    .nav,
    .today-btn {
        justify-content: center;
        margin: auto;
    }

    .calendar,
    .weekdays {
        gap: 5px;
    }

    .day {
        min-height: 95px;
        padding: 8px;
        border-radius: 13px;
    }

    .day.current {
        min-height: 105px;
    }

    .day-number {
        font-size: 15px;
    }

    .day.current .day-number {
        font-size: 20px;
    }

    .event {
        font-size: 8px;
        padding: 2px 5px;
        border-radius: 6px;
    }
}

@media (max-width: 600px) {

    .app {
        padding: 12px;
    }

    .calendar,
    .weekdays {
        gap: 3px;
    }

    .day {
        min-height: 78px;
        padding: 6px;
        border-radius: 9px;
    }

    .day.current {
        min-height: 88px;
    }

    .day-number {
        font-size: 13px;
    }

    .day.current .day-number {
        font-size: 17px;
    }

    .event {
        font-size: 7px;
        padding: 1px 3px;
    }

    #monthTitle {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="nav">
            <button onclick="changeMonth(-1)">‹</button>
            <button onclick="changeMonth(1)">›</button>
        </div>

        <div class="title-area">
            <h1 id="monthTitle"></h1>
            <div class="subtitle">Premium Calendar</div>
            <div class="clock" id="clock"></div>
        </div>

        <button class="today-btn" onclick="goToday()">TODAY</button>

    </header>

    <!-- السبت إلى الجمعة من اليسار لليمين -->

    <div class="weekdays">
        <div class="weekday">SAT</div>
        <div class="weekday">SUN</div>
        <div class="weekday">MON</div>
        <div class="weekday">TUE</div>
        <div class="weekday">WED</div>
        <div class="weekday">THU</div>
        <div class="weekday">FRI</div>
    </div>

    <main class="calendar" id="calendar"></main>

    <div class="footer">

        <div class="legend">
            <span class="dot purple"></span>
            اليوم
        </div>

        <div class="legend">
            <span class="dot green"></span>
            است
        </div>

        <div class="legend">
            <span class="dot red"></span>
            خنزرة
        </div>

        <div class="legend">
            <span class="dot yellow"></span>
            إجازة
        </div>

        <div class="legend">
            <span class="dot pink"></span>
            مناسبة
        </div>

    </div>

</div>

<script>

/* =========================================
   VARIABLES
========================================= */

const monthNames = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"
];

let today = new Date();

let currentMonth = today.getMonth();
let currentYear = today.getFullYear();


/* =========================================
   HIJRI DATE
========================================= */

function getHijri(date) {

    let formatter;

    try {

        formatter = new Intl.DateTimeFormat(
            "en-US-u-ca-islamic-umalqura",
            {
                day: "numeric",
                month: "numeric",
                year: "numeric"
            }
        );

    } catch {

        formatter = new Intl.DateTimeFormat(
            "en-US-u-ca-islamic",
            {
                day: "numeric",
                month: "numeric",
                year: "numeric"
            }
        );
    }

    const parts = formatter.formatToParts(date);

    const day = Number(
        parts.find(p => p.type === "day")?.value
    );

    const month = Number(
        parts.find(p => p.type === "month")?.value
    );

    const year = Number(
        parts.find(p => p.type === "year")?.value
        ?.replace(/\D/g, "")
    );

    return {
        day,
        month,
        year
    };
}


/* =========================================
   FIXED EVENTS
========================================= */

function getFixedEvent(month, day) {

    const events = {

        "2-22": {
            text: "يوم التأسيس 🇸🇦",
            className: "national"
        },

        "3-11": {
            text: "يوم العلم 🇸🇦",
            className: "national"
        },

        "6-5": {
            text: "يوم البيئة 🌱",
            className: "important"
        },

        "9-23": {
            text: "اليوم الوطني 🇸🇦",
            className: "national"
        },

        "12-9": {
            text: "مكافحة الفساد",
            className: "important"
        },

        "12-18": {
            text: "يوم اللغة العربية",
            className: "important"
        }

    };

    return events[`${month + 1}-${day}`] || null;
}


/* =========================================
   BIRTHDAY
========================================= */

function isBirthday(month, day) {

    return month === 0 && day === 21;

}


/* =========================================
   RAMADAN / EID
========================================= */

function getIslamicEvent(date) {

    const hijri = getHijri(date);


    /* رمضان */

    if (hijri.month === 9) {

        if (hijri.day === 1) {

            return {
                text: "رمضان 🌙",
                className: "ramadan"
            };

        }

        if (hijri.day === 21) {

            return {
                text: "العشر الأواخر 🌙",
                className: "ramadan"
            };

        }

        return {
            text: "",
            className: "ramadan-day"
        };
    }


    /* عيد الفطر */

    if (hijri.month === 10) {

        if (hijri.day === 1) {

            return {
                text: "عيد الفطر 🎉",
                className: "holiday"
            };

        }

        if (hijri.day >= 2 && hijri.day <= 4) {

            return {
                text: "إجازة العيد",
                className: "holiday"
            };

        }

    }


    /* يوم عرفة */

    if (
        hijri.month === 12 &&
        hijri.day === 9
    ) {

        return {
            text: "يوم عرفة 🕋",
            className: "important"
        };

    }


    /* عيد الأضحى */

    if (hijri.month === 12) {

        if (hijri.day === 10) {

            return {
                text: "عيد الأضحى 🐑",
                className: "holiday"
            };

        }

        if (
            hijri.day >= 11 &&
            hijri.day <= 13
        ) {

            return {
                text: "إجازة العيد",
                className: "holiday"
            };

        }

    }

    return null;
}


/* =========================================
   WEEKEND SCHEDULE
========================================= */

/*
   البداية:

   الخميس 3 سبتمبر 2026 = است
   الجمعة 4 سبتمبر 2026 = است

   الخميس 10 سبتمبر 2026 = خنزرة
   الجمعة 11 سبتمبر 2026 = خنزرة

   ثم تتكرر بالتناوب.
*/

function getWeekendEvent(date) {

    const day = date.getDay();

    /*
       JavaScript:
       الأحد = 0
       الاثنين = 1
       الثلاثاء = 2
       الأربعاء = 3
       الخميس = 4
       الجمعة = 5
       السبت = 6
    */

    if (day !== 4 && day !== 5) {
        return null;
    }

    const startDate = new Date(2026, 8, 3);

    const difference =
        Math.floor(
            (date - startDate) /
            (1000 * 60 * 60 * 24)
        );

    const weekDifference =
        Math.floor(difference / 7);

    if (weekDifference % 2 === 0) {

        return {
            text: "است",
            className: "rest"
        };

    }

    return {
        text: "خنزرة",
        className: "khanzara"
    };
}


/* =========================================
   MONTHLY BILLS
========================================= */

function getMonthlyBills(day) {

    if (day !== 25) {
        return [];
    }

    return [

        {
            text: "📡 قطة النت",
            className: "bills"
        },

        {
            text: "👷 قطة العامل",
            className: "bills"
        },

        {
            text: "⚡ قطة الكهرب",
            className: "bills"
        }

    ];
}


/* =========================================
   RENDER
========================================= */

function renderCalendar() {

    const calendar =
        document.getElementById("calendar");

    calendar.innerHTML = "";


    document.getElementById("monthTitle")
        .textContent =
        `${monthNames[currentMonth]} ${currentYear}`;


    /*
       مهم:

       JavaScript يعتبر:
       الأحد = 0
       ...
       السبت = 6

       لكن التقويم عندنا يبدأ:
       السبت = 0
       الأحد = 1
       ...

       لذلك نستخدم:
       (day + 1) % 7
    */

    const firstDay =
        (
            new Date(
                currentYear,
                currentMonth,
                1
            ).getDay() + 1
        ) % 7;


    const daysInMonth =
        new Date(
            currentYear,
            currentMonth + 1,
            0
        ).getDate();


    /* EMPTY CELLS */

    for (let i = 0; i < firstDay; i++) {

        const empty =
            document.createElement("div");

        empty.className = "day empty";

        calendar.appendChild(empty);
    }


    /* DAYS */

    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const date =
            new Date(
                currentYear,
                currentMonth,
                day
            );


        const cell =
            document.createElement("div");

        cell.className = "day";


        /* TODAY */

        if (
            day === today.getDate() &&
            currentMonth === today.getMonth() &&
            currentYear === today.getFullYear()
        ) {

            cell.classList.add("current");

        }


        /* DAY NUMBER */

        const number =
            document.createElement("div");

        number.className = "day-number";

        number.textContent = day;

        cell.appendChild(number);


        /* EVENTS CONTAINER */

        const eventsContainer =
            document.createElement("div");

        eventsContainer.className = "events";


        let events = [];


        /* ================================
           1. BIRTHDAY
        ================================= */

        if (
            isBirthday(
                currentMonth,
                day
            )
        ) {

            events.push({

                text: "يوم ميلاد عمكم 🎂",

                className: "birthday"

            });

        }


        /* ================================
           2. BILLS - DAY 25
        ================================= */

        const bills =
            getMonthlyBills(day);

        events.push(...bills);


        /* ================================
           3. RAMADAN / EID
        ================================= */

        const islamicEvent =
            getIslamicEvent(date);


        if (
            islamicEvent &&
            islamicEvent.text
        ) {

            events.push(islamicEvent);

        }


        if (
            islamicEvent?.className ===
            "ramadan-day"
        ) {

            cell.classList.add("ramadan-day");

        }


        /* ================================
           4. SAUDI EVENTS
        ================================= */

        const fixedEvent =
            getFixedEvent(
                currentMonth,
                day
            );


        if (fixedEvent) {

            events.push(fixedEvent);

        }


        /* ================================
           5. WEEKEND
        ================================= */

        /*
           إذا فيه مناسبة أو عيد
           ما نحط است / خنزرة
        */

        if (
            !isBirthday(
                currentMonth,
                day
            ) &&
            !fixedEvent &&
            !islamicEvent?.text
        ) {

            const weekend =
                getWeekendEvent(date);


            if (weekend) {

                events.push(weekend);

            }

        }


        /* ================================
           ADD EVENTS TO CELL
        ================================= */

        events.forEach(event => {

            const element =
                document.createElement("div");

            element.className =
                `event ${event.className}`;

            element.textContent =
                event.text;

            eventsContainer.appendChild(
                element
            );

        });


        cell.appendChild(
            eventsContainer
        );

        calendar.appendChild(cell);

    }

}


/* =========================================
   MONTH NAVIGATION
========================================= */

function changeMonth(amount) {

    currentMonth += amount;


    if (currentMonth < 0) {

        currentMonth = 11;
        currentYear--;

    }


    if (currentMonth > 11) {

        currentMonth = 0;
        currentYear++;

    }


    renderCalendar();

}


/* =========================================
   TODAY BUTTON
========================================= */

function goToday() {

    today = new Date();

    currentMonth =
        today.getMonth();

    currentYear =
        today.getFullYear();

    renderCalendar();

}


/* =========================================
   CLOCK
========================================= */

function updateClock() {

    const now =
        new Date();


    const time =
        now.toLocaleTimeString(
            "en-SA",
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        );


    document.getElementById("clock")
        .textContent = time;

}


/* =========================================
   AUTO UPDATE
========================================= */

renderCalendar();

updateClock();


setInterval(
    updateClock,
    1000
);


setInterval(
    () => {

        const now =
            new Date();

        const oldDate =
            today.toDateString();

        const newDate =
            now.toDateString();


        if (
            oldDate !== newDate
        ) {

            today = now;

            currentMonth =
                today.getMonth();

            currentYear =
                today.getFullYear();

            renderCalendar();

        }

    },
    60000
);

</script>

</body>
</html>
